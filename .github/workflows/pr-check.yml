name: PR Template & Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR Title & Template
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Check Conventional PR Title & Template Sections
        shell: python3 {0}
        run: |
          import os
          import re
          import sys

          title = (os.environ.get("PR_TITLE") or "").strip()
          body = (os.environ.get("PR_BODY") or "").strip()
          errors: list[str] = []

          # 1. Validate Conventional Commit PR Title
          title_pattern = re.compile(
              r"^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-zA-Z0-9_/-]+\))?!?: .+"
          )
          if not title_pattern.match(title):
              errors.append(
                  f"Invalid PR title: '{title}'. Must follow Conventional Commits "
                  "(e.g., 'feat(backend): add health check endpoint')."
              )

          # 2. Validate Required PR Template Sections
          required_sections = [
              "## Summary",
              "## Type of Change",
              "## Changes Made",
              "## Verification & Testing",
              "## Checklist",
          ]
          for section in required_sections:
              if section not in body:
                  errors.append(f"Missing required PR template section: '{section}'")

          # 3. Validate non-empty Summary section
          summary_match = re.search(
              r"## Summary\s*(.*?)(?=\n## |\Z)", body, flags=re.DOTALL
          )
          if summary_match:
              cleaned_summary = re.sub(r"<!--.*?-->", "", summary_match.group(1), flags=re.DOTALL).strip()
              if len(cleaned_summary) < 10:
                  errors.append(
                      "Section '## Summary' must contain a meaningful description (at least 10 characters)."
                  )

          # 4. Validate at least one checkbox is checked in Type of Change
          type_match = re.search(
              r"## Type of Change\s*(.*?)(?=\n## |\Z)", body, flags=re.DOTALL
          )
          if type_match and not re.search(r"- \[[xX]\]", type_match.group(1)):
              errors.append(
                  "Section '## Type of Change' must have at least one option checked with '- [x]'."
              )

          # 5. Forbid AI Co-Author / Attribution in PR Body
          forbidden_patterns = [
              r"^\s*co-authored-by:\s+.+",
              r"generated with claude",
              r"generated by ai",
          ]
          for pat in forbidden_patterns:
              if re.search(pat, body, flags=re.IGNORECASE | re.MULTILINE):
                  errors.append(f"Forbidden AI attribution detected in PR body matching '{pat}'.")

          # 6. Forbid illegal ASCII control characters (e.g., \x00-\x08, \x0b-\x0c, \x0e-\x1f)
          # PowerShell backtick escaping often inadvertently converts `a to ASCII 0x07 (Bell / ^G).
          illegal_control_chars = [
              c for c in body if ord(c) < 32 and c not in ("\n", "\r", "\t")
          ]
          if illegal_control_chars:
              hex_codes = sorted({f"0x{ord(c):02x}" for c in illegal_control_chars})
              errors.append(
                  f"PR description contains illegal control character(s): {hex_codes}. "
                  "This commonly occurs when PowerShell escape characters mangle backticks (e.g., `a -> ASCII 0x07 Bell). "
                  "Always write PR descriptions to a file and pass via 'gh pr create/edit --body-file <file>'."
              )

          # 7. Forbid shell escape mangling artifacts in Markdown
          shell_escape_patterns = [
              (
                  r"\\\^G",
                  "Detected mangled PowerShell bell artifact ('\\^G'). Pass Markdown via --body-file instead of inline CLI strings.",
              ),
              (
                  r"\\`",
                  "Detected backslash-escaped backtick ('\\`'). Use standard raw Markdown backticks.",
              ),
              (
                  r"\\/[a-zA-Z0-9_/-]+",
                  "Detected unnecessary backslash-escaped forward slash (e.g., '\\/path').",
              ),
          ]
          for pattern, msg in shell_escape_patterns:
              if re.search(pattern, body):
                  errors.append(f"Mangled shell escape sequence detected: {msg}")

          if errors:
              print("PR Validation Failed:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print("PR title and template validation passed successfully.")
